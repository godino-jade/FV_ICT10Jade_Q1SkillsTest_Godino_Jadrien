<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Skills Test</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>
    <!--
            <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
            <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
            
            <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
            <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
        -->
    <style>
        .container{ 
            border-radius: 10px;
            background-color: rgb(129, 206, 129);
            padding: 20px;
            margin: auto;
            margin-top: 20px;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="row">
            <h1>10 Jade's Coffee Shop</h1>
            <div class="col">
                <br>
                <form>
                    <label for="choose">Choose:</label>
                    
                    <br>
                    
                    <input type="checkbox" id="item1" value="100">
                    <label for="item1">Americano</label>
                        <br>
                    <input type="checkbox" id="item2" value="105">
                    <label for="item2">Spanish Latte</label>
                        <br>
                    <input type="checkbox" id="item3" value="110">
                    <label for="item3">Coffee Brew Malt</label>
                        <br>
                    <input type="checkbox" id="item4" value="120">
                    <label for="item4">Affogato</label>
                        <br>
                    <input type="checkbox" id="item5" value="120">
                    <label for="item5">Caramel Macchiato</label>

                    <br><br>

                    <label for="choose">Size:</label>
                        <br>
                    <input type="radio" id="regular" value=0 name="size" required>
                    <label for="regular">Regular / +Php 0</label>
                        <br>
                    <input type="radio" id="upsize" value="30" name="size">
                    <label for="upsize">Upsize / +Php 30</label>
                    
                    <br><br>
                    
                    <label for="options">Buy Pastries?</label>
                    <br>
                    <select id="pastries">
                        <option value="0">No thanks!</option>
                        <option value="99">Cookies</option>
                        <option value="129">Cheesecake</option>
                        <option value="159">Banana Bread</option>
                    </select>

                    <br><br><br>

                    <button type="button"py-click="place_order">Show Order</button>
                
                </form>
            </div>

            <div class="col">
                <div>
                    <h2>Your Receipt:</h2>
                    <div id="output1"></div>
                </div>
            </div>
            <script type="py" src="main.py"></script>
        </div>
    </div>
</body>
</html>
